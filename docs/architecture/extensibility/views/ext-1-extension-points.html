        <title id="ext-1-extension-points-title">
          HexaBlock extensibility · extension points of the engine
        </title>
        <desc id="ext-1-extension-points-desc">
          Extensibility diagram with the generic GameEngine in the center of layer 1, surrounded by
          every extension point a fifth variant implements: IVariantFactory, IGameRules through the
          abstract BaseGameRules, the TCell, TMove and TState type arguments, IScoringPolicy,
          IPieceSource, IProgressModel, ILevelBuilder and the optional capabilities IUndoable,
          IRedoable, ITimed and IRandomSeeded, plus StateMapper in layer 3, and CellRenderer and
          MoveControls in layer 4. The variant factory creates the rules, piece source, scoring and
          board. The four variants and the declared Hexa Fill implement them, one package each, and
          each declares its own open GameId. The lines start on classes: LinesFactory implements
          IVariantFactory, LinesRules extends BaseGameRules and MergeScoring implements
          IScoringPolicy, one line per kind for every variant. No line touches a frame or a package.
          GameEngine keeps its IGameRules as rules and its IScoringPolicy as scoring: two uses with
          the attribute name and its multiplicity. No box carries a role label of a pattern: a
          footnote names the pattern of each extension point. «Sprint N» marks the planned classes
          and members that the code does not have yet, with the docs/ROADMAP.md sprint of the
          requirement that each one serves.
        </desc>
