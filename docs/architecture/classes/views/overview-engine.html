        <title id="ovengine-title">HexaBlock generic engine map · UML class diagram</title>
        <desc id="ovengine-desc">
          Overview map of the 63 layer 1 engine classes in 14 groups. Each line joins two classes:
          GameEngine keeps its GamePhase, its optional MoveHistory and its IScoringPolicy and
          notifies through GameEventPublisher, BoardState keeps its Board, IVariantFactory creates
          the IGameRules and GeometryFactory creates the piece shapes. No line touches a group
          frame. Each group names the view that shows its members. A class that the code does not
          have yet carries «Sprint N»: the docs/ROADMAP.md sprint of the requirement it serves.
        </desc>
