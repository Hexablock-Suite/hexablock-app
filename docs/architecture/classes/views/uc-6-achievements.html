        <desc id="ucach-desc">
          Class diagram across layers 4, 3, 2 and 1 showing the achievements of issue 188.
          AchievementsScreen in layer 4 keeps the AchievementsPresenter of its hook.
          AchievementsPresenter in layer 3 keeps the UseCase input port and its
          AchievementsViewModel, which holds two AchievementSection values: in progress and
          completed. ListAchievements in layer 2 implements UseCase, keeps LevelRepository,
          ProgressRepository and a list of Achievement values, and returns one AchievementSummary
          per achievement. An Achievement keeps an optional AchievementGoal, a Strategy of layer 1
          that LevelsWon and EveryLevelWon implement. ProgressRepository loads GameProgress of layer
          1. The goals count the levels that LevelStatus.ofEach() of layer 1 gives as completed, and
          LevelStatus reads GameProgress (#326).
        </desc>
