        <desc id="ucgame-desc">
          Class diagram of layers 2 and 1 showing the StartGame, ApplyMove, UndoMove and RedoMove
          use cases, each implementing the UseCase input port and reaching the running game through
          the RunningGameStore output port, which holds at most one GameEngine; StartGame creates
          the game with an IVariantFactory and ApplyMove plays the move on the GameEngine of layer 1
          and passes a publisher failure to the Logger port; each use case answers with a plain
          MoveResult, and UndoMove and RedoMove ask the engine for undoable() and redoable().
