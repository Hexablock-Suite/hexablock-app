        <title id="fit-title">Hexa Fit variant · UML class diagram</title>
        <desc id="fit-desc">
          Class diagram of layer 1 for the Hexa Fit variant. FitLevelBuilder creates FitLevel.
          FitFactory holds one FitLevel and creates FitRules and FitScoring. FitRules uses FitMove
          as TMove and FitState as TState. Lollipops show the engine interface each variant class
          implements, with its binding. PieceId, the cell content, and Placement, the rotation and
          the offset of a placed piece, are value objects. FitState is an entity inside the
          GameEngine aggregate: its own GameStateId is its identity, it keeps the MatchId of its
          game, and it changes in place only through its business methods.
        </desc>
