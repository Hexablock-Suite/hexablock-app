        <title id="lines-title">Hexa Lines variant · UML class diagram</title>
        <desc id="lines-desc">
          Class diagram of layer 1 for the Hexa Lines variant. LinesFactory creates LinesRules and
          ComboMultiplierDecorator. ComboMultiplierDecorator extends the engine ScoringDecorator,
          binding TState to LinesState, and wraps LinesScoring. LinesRules uses LinesState as TState
          and PlacePiece as TMove. Lollipops show the engine interface each variant class
          implements, with its binding. LinesState is an entity inside the GameEngine aggregate: its
          own GameStateId is its identity, it keeps the MatchId of its game, and it changes in place
          only through its business methods. LinesSettings is a value object that LinesFactory
          holds: the board size, the Seed, and the shapes and the colors that a draw picks from.
        </desc>
