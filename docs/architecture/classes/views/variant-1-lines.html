        <title id="lines-title">Hexa Lines variant · UML class diagram</title>
        <desc id="lines-desc">
          Class diagram of layer 1 for the Hexa Lines variant. LinesFactory creates LinesRules and
          ComboMultiplierDecorator. ComboMultiplierDecorator extends the engine ScoringDecorator,
          binding TState to LinesState. It binds no inner type, because it reads no member of
          LinesScoring, and LinesFactory wraps a LinesScoring in it (issue 427). LinesRules uses
          LinesState as TState and PlacePiece as TMove. Lollipops show the engine interface each
          variant class implements, with its binding. LinesState is a part of GameEngine: its own
          GameStateId is its identity, it keeps the MatchId of its game, and it changes in place
          only through its business methods. LinesSettings is a value object that LinesFactory
          holds: the board size, and the shapes and the colors that a draw picks from. LinesFactory
          also holds the RandomSource of the root, and each match draws a new Seed from it. Streak,
          LineCount and CellCount are the three counts of the last placement that LinesState keeps:
          value objects that give their points as a Score. A PlacePiece names its tray piece with a
          TrayPosition (issue 232). ComboFactor is the combo multiplier lines + streak - 1: Streak
          builds it from the lines, and LineCount applies it to its line bonus (issue 427).
        </desc>

          (Part 1, view 7).
        </text>

        >

          declares it. In a binding, PlacePiece and LinesState stand for PlacePiece‹TCoord› and
          LinesState‹TCoord›.
        </text>
        <text
          x="24"

          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          Streak, LineCount, CellCount and TrayPosition keep their numbers private (issue 232): each
          count gives its points as a Score.
        </text>
        <text
          x="24"
          y="1272"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          LinesSnapshot keeps its fields private (#245): trayPieces(), currentStreak(), lastCombo()
          and lastPlacedCells(); LinesView delivers its tray with deliverTo().
        </text>
        <text
          x="24"
          y="1288"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          ComboFactor is the multiplier lines + streak - 1 (issue 427): the Streak builds it from
          the lines, and the LineCount applies it to its line bonus.
        </text>
        <text

          font-family="'IBM Plex Sans', sans-serif"
        >
          ComboMultiplierDecorator binds no inner type (issue 427): it reads no member of
          LinesScoring, and LinesFactory wraps a new LinesScoring in it.
        </text>
