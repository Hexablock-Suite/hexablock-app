        <title id="sources-title">
          HexaBlock piece sources, scoring and progress · UML class diagram
        </title>
        <desc id="sources-desc">
          Class diagram of layer 1 showing the IPieceSource strategy and iterator with its seeded
          and fixed-list implementations, both value objects whose take() returns the piece and the
          next source, SeededPieceSource keeping the Mulberry32Random random source that it builds
          from its seed and clones before each draw, the IScoringPolicy strategy wrapped by the
          abstract ScoringDecorator, and the IProgressModel strategy that records a GameResult in
          the GameProgress of its game: HighScoreProgress keeps the high score, and LevelProgress
          keeps the result of a level with the stars that the ILevelStars of the level counts. Seed
          is the value object of a seed: it checks its own number once, SeededPieceSource holds one
          privately and tells whether it draws from a seed with isSeededWith(), and Mulberry32Random
          starts from one: it keeps a GeneratorState and gives a RandomDraw on each next(), so no
          number leaves it. Score is the value object of a score: IScoringPolicy returns one, and
          GameResult and ProgressRecord hold one. Moves, ElapsedTime, Stars and LevelId are the
          value objects of the counters: GameResult holds a Moves (none for a game with no levels,
          D26), a LevelId and an ElapsedTime, and ProgressRecord holds a LevelId, Stars, a Moves and
          an ElapsedTime. Their fields are private: GameResult creates the ProgressRecord of a
          progress model with recordWith(), and ProgressRecord tells with improves() whether it is
          better than the stored record, by the order of DS-4. ProgressRecord tells with isOfGame()
          whether it is a record of a game, so a GameProgress refuses a record of another game.
          ProgressRecord gives the stars of its level with starsOf(), and its value objects to a
          repository of the edge with deliverTo().
        </desc>
