        <title id="sources-title">
          HexaBlock piece sources, scoring and progress · UML class diagram
        </title>
        <desc id="sources-desc">
          Class diagram of layer 1 showing the IPieceSource strategy and iterator with its seeded
          and fixed-list implementations, both value objects whose take() returns the piece and the
          next source, SeededPieceSource keeping the Mulberry32Random random source that it builds
          from its seed and clones before each draw, the IScoringPolicy strategy wrapped by the
          abstract ScoringDecorator, and the IProgressModel strategy that records a GameResult and
          returns a ProgressRecord. Range is the value object of a closed interval, which checks the
          seed of Mulberry32Random. Score is the value object of a score: IScoringPolicy returns
          one, and GameResult and ProgressRecord hold one. Moves, ElapsedTime, Stars and LevelId are
          the value objects of the counters: GameResult holds a Moves, a LevelId and an ElapsedTime,
          and ProgressRecord holds a LevelId and Stars.
        </desc>
