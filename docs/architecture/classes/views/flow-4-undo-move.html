      <h1>UndoMove across the four layers: the classes of one undo</h1>
      <svg

        <title id="flowundo-title">HexaBlock UndoMove flow · UML class diagram</title>
        <desc id="flowundo-desc">
          Cross-layer class diagram of the UndoMove use case only. In layer 4, GameScreen uses
          GamePresenter. In layer 3, GamePresenter uses the UseCase input port, and
          InMemoryRunningGameStore implements the RunningGameStore port and keeps the running
          GameEngine. In layer 2, UndoMove implements UseCase, keeps the RunningGameStore port and
          builds a MoveResult. In layer 1, GameEngine holds zero or one MoveHistory, the Command
          invoker, and returns it as the IUndoable capability; MoveHistory implements IUndoable and
          holds its MoveCommands. UndoMove calls undoable() on GameEngine, undo() on IUndoable and
          reads the cells of Board. Every dependency between layers points down.
        </desc>
