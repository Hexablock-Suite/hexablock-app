        <title id="flowundo-title">HexaBlock UndoMove flow · UML class diagram</title>
        <desc id="flowundo-desc">
          Cross-layer class diagram of the UndoMove use case only. In layer 4, GameScreen uses
          GamePresenter. In layer 3, GamePresenter uses the UseCase input port, and
          InMemoryGameRepository implements the GameRepository port and keeps the running
          GameEngine. In layer 2, UndoMove implements UseCase, keeps the GameRepository port and
          builds a MoveResult. In layer 1, GameEngine holds zero or one MoveHistory, the Command
          invoker, and answers for it: UndoMove asks offersUndo() and canUndo() and calls undo() on
          GameEngine, which asks its MoveHistory; MoveHistory implements IUndoable and holds its
          MoveCommands. UndoMove reads the occupied cells and the free spaces of Board. Every
          dependency between layers points down.
        </desc>
