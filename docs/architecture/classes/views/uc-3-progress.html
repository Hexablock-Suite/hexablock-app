        <title id="ucprogress-title">HexaBlock progress use cases · UML class diagram</title>
        <desc id="ucprogress-desc">
          Class diagram of layer 2 showing the use cases SaveProgress, LoadProgress, ListLevels and
          SyncLeaderboard, each implementing the UseCase input port with its binding, and the output
          ports they use: SaveProgress and LoadProgress use ProgressRepository, SaveProgress to
          record each result in the progress of its game and LoadProgress to read the saved progress
          of the game of its request back, or undefined when the game has none (#181); ListLevels
          uses LevelRepository and ProgressRepository, takes the game and the chosen figure and
          returns LevelSummary values, each with a LevelStatus of layer 1, a closed set (completed,
          open, locked) whose ofEach() gives the status of each level from GameProgress (#326), and
          SyncLeaderboard uses LeaderboardGateway and ProgressRepository. LevelRepository also finds
          the one level of a game that a start names by its id (#172). SaveProgress keeps the GameId
          of its game and returns no value; LoadProgress takes the GameId in its request, as
          ListLevels does (#410), and answers the whole GameProgress. ProgressRepository loads and
          saves the GameProgress of one game in layer 1: one object with the high score and the best
          result of each level, which gives the stars of a level with starsOf() and delivers its
          data to a repository of the edge with deliverTo(). AchievementCounterRepository loads and
          saves the AchievementCounters of one game in layer 1 (#363): its own aggregate, with a
          best count and a total, each an AchievementCount.
        </desc>
