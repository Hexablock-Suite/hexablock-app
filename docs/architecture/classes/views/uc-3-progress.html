      <svg

        <title id="ucprogress-title">HexaBlock progress use cases · UML class diagram</title>
        <desc id="ucprogress-desc">
          Class diagram of layer 2 showing the use cases SaveProgress, LoadProgress, ListLevels and
          SyncProgress, each implementing the UseCase input port with its binding, and the output
          ports they use: SaveProgress and LoadProgress use ProgressRepository, SaveProgress to
          record each result in the progress of its game and LoadProgress to read the saved progress
          of the game of its request back, or undefined when the game has none (#181); ListLevels
          uses LevelRepository and ProgressRepository, takes the game and the chosen figure and
          returns a LevelList (#307): one LevelSummary per level of the figure, each with a
          LevelStatus of layer 1, a closed set (completed, open, locked) whose ofEach() gives the
          status of each level from GameProgress (#326). The leaderboard use cases of #47 and their
          port LeaderboardGateway live in view 3.7. Apart from the summaries, the LevelList holds
          the LevelId of each unavailable level of the game, which LevelRepository names with
          unavailable(): a level that breaks a rule (#307). LevelRepository also finds the one level
          of a game that a start names by its id (#172). SaveProgress keeps the GameId of its game
          and returns no value; LoadProgress takes the GameId in its request, as ListLevels does
          (#410), and answers the whole GameProgress. ProgressRepository gives the ProgressOwner,
          the last signed-in user or the anonymous owner, with owner(), and loads and updates the
          GameProgress of one game of that owner in one queue per key in layer 1: one object with
          the high score and the best result of each level, which gives the stars of a level with
          starsOf() and delivers its data to a repository of the edge with deliverTo().
          AchievementCounterRepository loads and saves the AchievementCounters of one game in layer
          1 (#363): its own object, apart from GameProgress, with a best count and a total, each an
          AchievementCount. SyncProgress (#46) uses SessionStore, ProgressRepository,
          AnonymousProgress and ProgressGateway: the user of the session is the owner, it merges the
          anonymous progress into that owner with mergeAnonymousInto(), sends the progress through
          ProgressGateway, which throws a SyncFailure for a known failure, and merges the answer
          through update().
        </desc>
