        <title id="flowlogin-title">HexaBlock Login flow · UML class diagram</title>
        <desc id="flowlogin-desc">
          Cross-layer class diagram of the Login use case only. In layer 4, AccountScreen uses
          AccountPresenter; ApiClient, the driver, implements the AccountApi transport interface of
          layer 3 (decision 22); DeviceSecretStore, the driver of the secure storage, implements the
          SecretStore driver interface of layer 3. In layer 3, AccountPresenter uses the UseCase
          input port; ApiAccountGateway keeps ApiDtoMapper and AccountApi and implements the
          AccountGateway port of layer 2; SessionManager keeps SecretStore and implements the
          SessionStore port of layer 2. In layer 2, Login implements UseCase, takes Credentials and
          keeps the AccountGateway and SessionStore ports; AccountGateway returns a Session. Login
          touches no entity of layer 1. Every dependency between layers points down.
        </desc>
