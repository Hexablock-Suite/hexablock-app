        <title id="flowlogin-title">HexaBlock Login flow · UML class diagram</title>
        <desc id="flowlogin-desc">
          Cross-layer class diagram of the Login use case only. In layer 4, AccountScreen uses
          AccountPresenter; ApiAccountGateway keeps ApiDtoMapper and ApiClient and implements the
          AccountGateway port of layer 2; SessionManager implements the SessionStore port of layer
          2. In layer 3, AccountPresenter uses the UseCase input port. In layer 2, Login implements
          UseCase, takes Credentials and keeps the AccountGateway and SessionStore ports;
          AccountGateway returns a Session. Login touches no entity of layer 1. Every dependency
          between layers points down.
        </desc>
