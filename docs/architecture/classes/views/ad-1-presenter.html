        <desc id="adpresenter-desc">
          Class diagram across layers 4, 3 and 2 showing the GameScreen route using GamePresenter
          and rendering BoardView, BoardView keeping the CellRenderer of the variant and the
          BoardLayout of the figure, which HexLayout, SquareLayout and TriangleLayout implement,
          BoardView reading GameViewModel, GamePresenter building GameViewModel, mapping each
          occupied cell, each free space and the payload of the plain MoveResult through the
          StateMapper strategy that the default SpaceStateMapper implements, and calling the UseCase
          input port of layer 2, which returns a Result.
