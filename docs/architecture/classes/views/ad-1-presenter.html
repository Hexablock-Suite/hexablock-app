      <svg

        <title id="adpresenter-title">HexaBlock game presenter · UML class diagram</title>
        <desc id="adpresenter-desc">
          Class diagram across layers 4, 3 and 2 showing the GameScreen route using GamePresenter
          and rendering BoardView, BoardView keeping the CellRenderer of the variant and the
          BoardLayout of the figure, which lives in layer 3 and which HexLayout, SquareLayout and
          TriangleLayout implement; the layout gives the outline of each cell, and the renderer
          draws that outline (#296), BoardView reading GameViewModel, GamePresenter building
          GameViewModel, mapping each occupied cell, each free space and the payload of the plain
          MoveResult through the StateMapper strategy that FitStateMapper and MergeStateMapper
          implement, and calling the UseCase input port of layer 2, which returns a Result.
          GameScreen also keeps the MoveControls strategy of the game, which FitControls and
          MergeControls implement; the controls take a press on a space of BoardView and play a
          move. Each variant registers its own state mapper, cell renderer and move controls, and
          the registry has no default parts. GamePresenter also undoes and redoes a move through the
          UseCase port, and GameViewModel holds the undo and the redo of a variant with undo, which
          FitControls show as two buttons. MergeControls show the undo only, because Merge never
          redoes. Since #292 MergeControls also play a slide with a swipe on the board and, on the
          web, with a key.
        </desc>

        </text>
        <text

          FitStateMapper, FitCellRenderer and FitControls are the parts of Hexa Fit (#175). The view
          leaves out the parts of Lines and Sort (#174, #176).
        </text>
        <text
          x="24"
          y="1444"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          MergeStateMapper, MergeCellRenderer and MergeControls are the parts of Hexa Merge (#177).
          MergeControls show the undo only, because Merge never redoes (#179).
        </text>
        <text
          x="24"
          y="1460"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          GameStage gives the board, play(), undo() and redo() to the controls of the game (#178).
          LevelSelectorPresenter, AccountPresenter and LeaderboardPresenter (#47) follow the same
          shape.
        </text>
        <text
          x="24"
          y="1476"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          BoardView lives in src/infrastructure/board/ (S3-07, Q8), and the figure layouts in
          src/adapters/board/ (#393). HomePresenter calls no use case (decision 53).
        </text>
        <text
          x="24"
          y="1492"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          MoveResult is plain data with no Board (decision 29). A failed Result puts its text in
          GameViewModel.error (decision 28). onEvent() is planned (view 4.3).
        </text>
        <text
          x="24"
          y="1508"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          The view in the payload keeps its fields private, so toPayload() receives its data with
          deliverTo() (decisions 7 and 29, #245).
        </text>
        <text
          x="24"
          y="1524"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          GameScreen and BoardView are React components of layer 4, not classes. MergeControls also
          take a swipe on the board and, on the web, a key (#292).
        </text>
        <text
          x="24"
          y="1540"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          FigureStone and FigureSelector draw the origin cell of a figure, which
          CompositionRoot.figureShape() gives from its BoardLayout, with CellOutline (#297).
        </text>
        <text

          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          The GameScreen box stands for the route and the GameStage that it renders: GameStage holds
          presenter and controls, reads GameViewModel and renders BoardView.
        </text>
        <text

          read-only.
        </text>
