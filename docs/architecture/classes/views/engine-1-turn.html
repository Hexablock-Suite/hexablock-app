      <h1>The turn: Template Method over Strategy</h1>

      <svg
        viewBox="0 0 1040 1377"
        xmlns="http://www.w3.org/2000/svg"

        aria-labelledby="engine-turn-title engine-turn-desc"

        <title id="engine-turn-title">HexaBlock engine turn · UML class diagram</title>
        <desc id="engine-turn-desc">
          Class diagram of layer 1 showing GameEngine, the aggregate root of a game, running each
          turn through the IGameRules strategy, whose playTurn() is the template method of
          BaseGameRules and returns a Resolution that holds an Outcome, scoring with the
          IScoringPolicy strategy, holding a GamePhase state, recording the GameEvent objects of its
          turns, which ApplyMove takes with takeEvents() and delivers, and bounding its TState
          parameter by BoardState and Cloneable of TState in its template box. A dark dashed frame
          marks the boundary of the game aggregate: the root and its internal entities, the
          BoardState, the Board of the state and the timer of a timed game. The root joins the state
          and the timer, an ITimed, with a filled diamond. BoardState declares no board, and the
          reference boxes of the board and of ITimed name views 2 and 3. IGameRules declares only
          validMoves() and playTurn() (decision 21). The optional history, an IUndoable that
          declares the five members the root calls (decision 27), and the optional timer stay
          inside: the root answers for them with undo(), redo(), canUndo(), canRedo(), offersUndo()
          and elapsedTime(). BoardState is an entity inside the GameEngine aggregate: its own
          GameStateId is its identity, it keeps the MatchId of its game, its fields are private, and
          it changes in place only through its business methods. Its snapshot() creates a
          BoardSnapshot, the immutable photo of the Memento pattern: GameEngine.snapshot() returns
          it, IScoringPolicy reads two of them as SnapshotOf of its TState, the photo type that
          snapshot() gives, and the history keeps them for the undo. BoardSnapshot is abstract and
          its fields are private: a reader asks isPhotoOf(), belongsTo(), boardCopy() and
          scoreSoFar(), and each variant photo implements view(). Resolution is a value object: it
          holds no state, its two fields are private, a reader asks wasAccepted(), endsTheGame(),
          phaseAfter() and leadsTo(), and equals() compares accepted and outcome. Score is the value
          object of the score and of the points of a turn: IScoringPolicy returns one, BoardState
          adds it, and BoardSnapshot gives the score with scoreSoFar().
        </desc>
