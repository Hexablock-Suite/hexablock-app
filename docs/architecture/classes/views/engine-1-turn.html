      <h1>The turn: Template Method over Strategy</h1>

      <svg

        <title id="engine-turn-title">HexaBlock engine turn · UML class diagram</title>
        <desc id="engine-turn-desc">
          Class diagram of layer 1 showing GameEngine, the aggregate root of a game, running each
          turn through the IGameRules strategy, whose playTurn() is the template method of
          BaseGameRules and returns a Resolution that holds an Outcome, scoring with the
          IScoringPolicy strategy, holding a GamePhase state, notifying through the
          GameEventPublisher interface, and bounding its TState parameter by BoardState and
          Cloneable of TState in its template box. The optional MoveHistory gives the undoable() and
          redoable() capabilities. BoardState is an entity inside the GameEngine aggregate: its own
          GameStateId is its identity, it keeps the MatchId of its game, its fields are private, and
          it changes in place only through its business methods. Its snapshot() creates a
          BoardSnapshot, the immutable photo with the Memento role and no tactical stereotype:
          GameEngine.snapshot() returns it, IScoringPolicy reads two of them, and MoveHistory keeps
          them for the undo. Resolution is a value object: it holds no state, and equals() compares
          accepted and outcome. Score is the value object of the score and of the points of a turn:
          IScoringPolicy returns one, BoardState adds it, and BoardSnapshot carries the score.
        </desc>
