        <desc id="engine-turn-desc">
          Class diagram of layer 1 showing GameEngine, the aggregate root of a game, running each
          turn through the IGameRules strategy, whose playTurn() is the template method of
          BaseGameRules and returns a Resolution that holds an Outcome, scoring with the
          IScoringPolicy strategy, holding a GamePhase state, notifying through the
          GameEventPublisher interface, and bounding its TState parameter by BoardState and
          Cloneable of TState in its template box. The optional MoveHistory and the undoable() and
          redoable() accessors are planned for Sprint 3.
        </desc>
