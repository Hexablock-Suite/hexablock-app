          Class diagram of layer 1 showing GameEngine, the aggregate root of a game, running each
          turn through the IGameRules strategy, whose playTurn() is the template method of
          BaseGameRules, scoring with the IScoringPolicy strategy, holding a GamePhase state and an
          optional MoveHistory, giving its undo and redo capabilities through typed accessors,
          notifying through the GameEventPublisher interface, and bounding its TState parameter by
          BoardState in its template box.
