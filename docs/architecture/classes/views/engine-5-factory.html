      <h1>Wiring a variant: Abstract Factory, Builder, Observer and injected interfaces</h1>

      <svg

        <title id="factory-title">HexaBlock variant wiring · UML class diagram</title>
        <desc id="factory-desc">
          Class diagram of layer 1 showing the IVariantFactory abstract factory that creates the
          rules, piece source, scoring, board, progress model, initial state and optional history of
          a variant, the ILevelBuilder builder, the GameEventPublisher interface that publishes
          GameEvent values such as GameOver, the Clock and RandomSource interfaces that layer 4
          implements, and the three id generator interfaces that give the MatchId of each new match,
          the GameStateId of its first state and the BoardId of its board, all value objects.
          GameFactory keeps an IVariantFactory, the three generators and a GameEventPublisher and
          creates the started GameEngine, and GameOver carries the GameId and the MatchId.
        </desc>
