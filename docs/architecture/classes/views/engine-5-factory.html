      <h1>Wiring a variant: Abstract Factory, Builder, Observer and injected interfaces</h1>

        <title id="factory-title">HexaBlock variant wiring · UML class diagram</title>
        <desc id="factory-desc">
          Class diagram of layer 1 showing the IVariantFactory abstract factory that creates the
          rules, piece source, scoring, board, progress model, initial state and optional history of
          a variant, LevelDefinition, the data of one level file, which directs the ILevelBuilder
          builder, the abstract GameEvent with GameOver, the domain event that the root records when
          a game ends, the Clock and RandomSource interfaces that layer 4 implements, and the
          MatchIdGenerator interface that gives the MatchId of each new match. The internal ids are
          local value objects that keep the MatchId of their match: GameFactory builds the
          GameStateId of the first state and the BoardId of its board from it, and FitFactory builds
          the LevelTimerId of the timer of a timed game in createTimer(). GameFactory keeps the
          GameId of the game, an IVariantFactory that answers isFor() for it and the
          MatchIdGenerator, wraps the rules of a timed game in TimedRulesDecorator, gives the same
          timer to the root and creates the started GameEngine. GameOver keeps the MatchId, the
          Outcome and the final Score, a value object, GameEvent keeps the GameId, and the fields
          are private: a listener asks isVictory() or receives the data through deliverTo().
        </desc>
