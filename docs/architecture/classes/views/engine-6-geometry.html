          HexaBlock geometry family and board builder · UML class diagram
        </title>
        <desc id="geometry-desc">
          Class diagram of layer 1 showing the GeometryFactory abstract factory, which creates the
          coordinate, the topology and the piece shapes of one geometry, with HexGeometry creating
          HexCoord and HexTopology and SquareGeometry creating SquareCoord, the three coordinate
          value objects HexCoord, SquareCoord and TriangleCoord with private values and their own
          operations, the value object TopologyId that names a family, the axis and direction value
          objects of the three topologies, each a closed set of instances that implements GridAxis
          or GridDirection, and BoardBuilder, the builder that the class calls a DDD factory,
          holding a GeometryFactory and creating the Board.
        </desc>

          font-family="'IBM Plex Sans', sans-serif"
        >
          Each variant factory keeps the GeometryFactory in its geometry attribute (Part 2): no
          class per game and geometry. Screen layout per geometry stays in layer 4 (decision 17).
        </text>
        <text
          x="24"
          y="1364"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          SquareGeometry creates SquareCoord and SquareTopology, and TriangleGeometry creates
          TriangleCoord and TriangleTopology. A 3D cell is one more family (§8).
        </text>
        <text
          x="24"
          y="1380"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          HexTopology binds TAxis and TDirection of GridTopology to HexAxis and HexDirection
          (decision 45). An axis steps along itself, and a direction gives the neighbor of a cell.
        </text>
        <text
          x="24"
          y="1396"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          Each closed set has one frozen instance per value, so equals() compares by identity. A
          level file keeps the text of a TopologyId, and of() refuses an unknown text.
        </text>
