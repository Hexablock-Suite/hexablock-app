      <h1>Geometry and board: Abstract Factory and Builder</h1>

        <title id="geometry-title">
          HexaBlock geometry family and board builder · UML class diagram
        </title>
        <desc id="geometry-desc">
          Class diagram of layer 1 showing the GeometryFactory abstract factory, which creates the
          coordinate, the topology and the piece shapes of one geometry and turns each coordinate of
          a level file into a coordinate value for FitLevelBuilder, with HexGeometry creating
          HexCoord and HexTopology and SquareGeometry creating SquareCoord, the three coordinate
          value objects HexCoord, SquareCoord and TriangleCoord with private values and their own
          operations, the value object TopologyId that names a family, which each concrete factory
          keeps private and which GeometryFactory answers with isOfFamily(), the axis value objects
          of the three topologies, each a closed set of instances that implements GridAxis, the
          internal direction classes that each topology keeps private for neighbors(), and
          BoardBuilder, the builder that the class calls a DDD factory, holding a GeometryFactory
          and creating the Board.
        </desc>
