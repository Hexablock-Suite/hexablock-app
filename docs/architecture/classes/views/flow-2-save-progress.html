        <title id="flowsave-title">HexaBlock SaveProgress flow · UML class diagram</title>
        <desc id="flowsave-desc">
          Cross-layer class diagram of the SaveProgress use case only. In layer 4, VictoryScreen
          shows the view model of ResultPresenter, and ApiClient, the driver, implements the
          ProgressApi transport interface of layer 3 (decision 22). In layer 3, GamePresenter gives
          the last MoveResult to ResultPresenter, which builds the GameResult and uses the UseCase
          input port, and ApiProgressRepository keeps ApiDtoMapper and ProgressApi and implements
          the ProgressRepository port of layer 2. In layer 2, SaveProgress implements UseCase, keeps
          the ProgressRepository port, the IProgressModel strategy and the GameId of its game,
          starts a GameProgress when the game has none, and returns no value. The port loads and
          saves the GameProgress of one game. In layer 1, IProgressModel records a GameResult in
          that GameProgress: the fields of GameResult are private, and its recordWith() creates the
          record. Every dependency between layers points down.
        </desc>
