        <title id="flowsave-title">
          HexaBlock SaveProgress and SyncProgress flow · UML class diagram
        </title>
        <desc id="flowsave-desc">
          Cross-layer class diagram of the SaveProgress use case and of the SyncProgress use case
          that runs after each save (#46, D27). In layer 4, VictoryScreen shows the view model of
          ResultPresenter, and ApiClient, the driver, implements the ProgressApi transport interface
          of layer 3 (decision 22). In layer 3, GamePresenter gives the last MoveResult to
          ResultPresenter, which builds the GameResult and uses the UseCase input ports of
          SaveProgress and SyncProgress. LocalProgressRepository keeps KeyValueStore, SessionStore
          and one queue per key, and implements the ProgressRepository and AnonymousProgress ports.
          ApiProgressGateway keeps ApiDtoMapper and ProgressApi and implements the ProgressGateway
          port. SessionManager implements the SessionStore port. In layer 2, SaveProgress implements
          UseCase and keeps ProgressRepository, IProgressModel and the GameId of its game.
          SyncProgress implements UseCase and keeps SessionStore, ProgressRepository,
          AnonymousProgress and ProgressGateway, and creates the ProgressOwner of the session. The
          three progress ports take that owner explicitly. In layer 1, IProgressModel records a
          GameResult in the GameProgress, and SyncProgress merges a progress into it with
          mergeWith(). Every dependency between layers points down.
        </desc>

          through update() of ProgressRepository, which loads and saves in one queue per owner and
          game (S3-04). It needs no session (D27).
        </text>

          AnonymousProgress over KeyValueStore. Its key carries the owner, the last signed-in user
          that SessionStore keeps (decision 66).
        </text>

          owner: it merges the anonymous progress into the owner, sends the progress through
          ProgressGateway, and through update() merges
        </text>

          POST /v1/progress through ProgressApi, which ApiClient implements (decisions 22 and 66).
        </text>
