      <h1>Leaderboards: one input port per board over the leaderboard port</h1>

      <svg

        <title id="ucboard-title">HexaBlock leaderboard use cases · UML class diagram</title>
        <desc id="ucboard-desc">
          Class diagram of layer 2 showing the use cases GetGlobalLeaderboard and
          GetLevelLeaderboard of #47 (APP-FR-14), each implementing the UseCase input port with its
          binding: one input port per board, as hexablock-api#218 decided. Both keep the
          SessionStore output port of view 3.4 as sessions and the LeaderboardGateway output port as
          gateway. LeaderboardGateway reads the global board of a game or the board of one level
          with the session and returns a Leaderboard, and it throws a LeaderboardFailure with a
          failure code for a known failure. A Leaderboard holds LeaderboardRow values in the order
          of the backend, each with the rank of the backend, the username and a LeaderboardRecord: a
          score, a standing with the totals of the level results, or the result of one level.
        </desc>
