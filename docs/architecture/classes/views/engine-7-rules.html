      <h1>The rules: Template Method and Decorator</h1>

      <svg

        <title id="rules-title">HexaBlock game rules · UML class diagram</title>
        <desc id="rules-desc">
          Class diagram of layer 1 showing the abstract BaseGameRules, which implements the
          IGameRules strategy and holds playTurn() as a template method over abstract steps, both
          returning a Resolution, the value object that holds whether the rules accepted the move
          and the Outcome and no state, in private fields that a reader asks through wasAccepted(),
          endsTheGame(), phaseAfter() and leadsTo(), LinesRules and FitRules extending it (planned
          for Sprint 2), and TimedRulesDecorator, which implements IGameRules, wraps an inner
          IGameRules and times the game with a LevelTimer. The decorator times playTurn() and passes
          the other five operations, validMoves() included, to its inner rules (decision 33). It
          hands out no timer: the root keeps the same timer and answers elapsedTime() (decision 27).
        </desc>
