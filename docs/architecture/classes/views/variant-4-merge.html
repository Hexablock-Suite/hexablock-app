        <title id="merge-title">HexaBlock Hexa Merge variant · UML class diagram</title>
        <desc id="merge-desc">
          Class diagram of the Hexa Merge variant in layer 1 showing MergeRules bounding its TCell
          parameter by the engine interface IMergeable, MergeTile implementing IMergeable with T
          bound to MergeTile, MergeRules typed by MergeState and Slide, and MergeFactory binding
          TCell to MergeTile on MergeRules and creating MergeScoring, each variant class marked with
          the engine interface it implements and its binding. MergeState is an entity inside the
          GameEngine aggregate: its own GameStateId is its identity, it keeps the MatchId of its
          game, and it changes in place only through its business methods.
        </desc>
