      <h1>Undo and redo: Command and segregated capabilities</h1>

      <svg
        viewBox="0 0 1040 1072"

        <title id="history-title">HexaBlock undo and redo · UML class diagram</title>
        <desc id="history-desc">
          Class diagram of layer 1 showing MoveHistory as the Command invoker that keeps the done
          MoveCommand objects and implements IUndoable, RedoableHistory extending it with redo
          through IRedoable and keeping the undone MoveCommand objects, and LevelTimer implementing
          the separate ITimed capability. LevelTimer is an entity inside the GameEngine aggregate:
          its LevelTimerId is its identity, and equals() compares two timers by that id. The timer
          keeps its start, its stop and the start of a pause as ClockReading values, and the sum of
          the ended pauses as an ElapsedTime. GameEngine pauses and resumes it through ITimed, and
          elapsedMs() leaves the paused spans out (decision 19, #428). ClockReading.elapsedSince()
          gives the ElapsedTime between two readings: never negative, in whole milliseconds. Each
          MoveCommand keeps two TMemento values, the immutable photos of the state before and after
          the move, which BoardState.snapshot() gives (view 1, decision 34): undo() gives back the
          first and redo() the second. MoveHistory hands each undone command to its protected
          keepUndone(), which RedoableHistory overrides to keep the command for redo(). IUndoable
          declares the five members that GameEngine calls: record(), clear(), canUndo(), undo() and
          redoable(), so the root depends on the interface, not on MoveHistory (decision 27).
        </desc>

            Clock interface (APP-NFR-07).
          </text>

            identity, and equals() compares two timers by it (decisions 19 and 26, view 5).
          </text>

            font-size="11"
            font-family="'IBM Plex Sans', sans-serif"
          >

            elapsedSince() never gives a negative time and drops a fraction of a millisecond
            (decisions 19 and 25).
          </text>
          <text

            font-size="11"
            font-family="'IBM Plex Sans', sans-serif"
          >
            The history never reads a photo: BoardState.restore() asks its queries, and every field
            of BoardSnapshot is private (decision 7, #245).
          </text>
          <text
            x="24"
            y="672"
            fill="#5b6873"
            font-size="11"
            font-family="'IBM Plex Sans', sans-serif"
          >
            undo() gives each undone command to keepUndone(): RedoableHistory keeps it, and redo()
            gives back its after photo. A new move and clear() forget it (decisions 3 and 34, #178).
          </text>

            paused span: pausedAt and pausedFor (decision 19, #428).
