        <title id="flowmove-title">HexaBlock ApplyMove flow · UML class diagram</title>
        <desc id="flowmove-desc">
          Cross-layer class diagram of the ApplyMove use case only. In layer 4, GameScreen uses
          GamePresenter and reads GameViewModel. In layer 3, GamePresenter keeps the StateMapper
          strategy, builds GameViewModel and uses the UseCase input port; InMemoryRunningGameStore
          implements the RunningGameStore port. In layer 2, ApplyMove implements UseCase, takes an
          ApplyMoveRequest, builds a MoveResult and keeps the RunningGameStore and Logger ports. In
          layer 1, ApplyMove plays the move on GameEngine, which keeps the IGameRules strategy, and
          reads the cells of Board. Every dependency between layers points down.
        </desc>
