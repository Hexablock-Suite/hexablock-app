        <title id="flowmove-title">HexaBlock ApplyMove flow · UML class diagram</title>
        <desc id="flowmove-desc">
          Cross-layer class diagram of the ApplyMove use case only. In layer 4, GameScreen uses
          GamePresenter and reads GameViewModel. In layer 3, GamePresenter keeps the StateMapper
          strategy, builds GameViewModel and uses the UseCase input port; InMemoryGameRepository
          implements the GameRepository port. In layer 2, ApplyMove implements UseCase, takes an
          ApplyMoveRequest, builds a MoveResult and keeps the GameRepository and GameEventPublisher
          ports; the MoveResult carries each failed delivery of the publisher in failedDeliveries.
          In layer 1, ApplyMove plays the move on GameEngine, which keeps the IGameRules strategy.
          ApplyMove then takes the events that GameEngine records and reads the occupied cells and
          the free spaces of Board. Every dependency between layers points down.
        </desc>
