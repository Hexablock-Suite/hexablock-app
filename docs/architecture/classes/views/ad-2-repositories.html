        <desc id="adrepos-desc">
          Class diagram across layers 4, 3 and 2 showing ApiProgressRepository in layer 4, which
          holds the ApiClient and the ApiDtoMapper and implements the ProgressRepository port of
          layer 2 directly, and LocalProgressRepository in layer 3, which holds the KeyValueStore
          driver interface of layer 3 and implements the same port with load() and save(): it keeps
          the GameProgress of each game as plain JSON in the store.
          LocalAchievementCounterRepository in layer 3 holds the same KeyValueStore and implements
          the AchievementCounterRepository port of layer 2: it keeps the AchievementCounters of each
          game as plain JSON with a version under its own key (#363). DeviceKeyValueStore implements
          KeyValueStore over AsyncStorage.
