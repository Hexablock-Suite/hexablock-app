        <title id="adrepos-title">HexaBlock repositories · UML class diagram</title>
        <desc id="adrepos-desc">
          Class diagram across layers 4, 3 and 2 showing ApiProgressRepository in layer 3, which
          holds the ProgressApi transport interface and the ApiDtoMapper of layer 3 and implements
          the ProgressRepository port of layer 2. ApiClient in layer 4, the driver, implements
          ProgressApi (decision 22, #404). LocalProgressRepository in layer 3 holds the
          KeyValueStore driver interface of layer 3 and implements the same port with load() and
          save(): it keeps the GameProgress of each game as plain JSON in the store.
          LocalAchievementCounterRepository in layer 3 holds the same KeyValueStore and implements
          the AchievementCounterRepository port of layer 2: it keeps the AchievementCounters of each
          game as plain JSON with a version under its own key (#363). DeviceKeyValueStore implements
          KeyValueStore over AsyncStorage.
        </desc>
