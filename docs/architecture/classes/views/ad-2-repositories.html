        <title id="adrepos-title">HexaBlock repositories · UML class diagram</title>
        <desc id="adrepos-desc">
          Class diagram across layers 4, 3 and 2 showing ApiProgressGateway in layer 3, which holds
          the ProgressApi transport interface and the ApiDtoMapper of layer 3 and implements the
          ProgressGateway port of layer 2 (decisions 22 and 66, #46). ApiClient in layer 4, the
          driver, implements ProgressApi. LocalProgressRepository in layer 3 holds the KeyValueStore
          driver interface of layer 3, the SessionStore port and one queue per key, and implements
          two ports: ProgressRepository with owner(), load() and update(), and AnonymousProgress
          with mergeAnonymousInto(). It keeps the GameProgress of each game as plain JSON in the
          store, under a key with the owner, the last signed-in user that SessionStore keeps, or
          under the anonymous key for the anonymous owner (decision 66).
          LocalAchievementCounterRepository in layer 3 holds the same KeyValueStore and implements
          the AchievementCounterRepository port of layer 2: it keeps the AchievementCounters of each
          game as plain JSON with a version under its own key (#363). DeviceKeyValueStore implements
          KeyValueStore over AsyncStorage. ApiClient also implements LevelsApi, and getLevels()
          stops after LEVELS_TIMEOUT_MS. ApiLevelRepository in layer 3 holds LevelsApi and the last
          good answer of GET /v1/levels, answers from it at once and starts one refresh() at a time
          (decision 68, #48). CombinedLevelRepository, a Composite, holds two parts of the
          LevelRepository port, the bundled one and the backend one, and joins their levels by the
          rule of DS-11. CombinedLevelRepository, BundledLevelRepository and ApiLevelRepository
          implement LevelRepository, whose unavailable() names the backend levels that break a rule
          (#307).
        </desc>

        </text>
        <text

          y="1256"

          font-size="11"

          replaces a bundled copy only with a higher version (DS-11).
        </text>
        <text
          x="24"
          y="1272"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >

          level that breaks a rule and has no bundled copy (#307).
        </text>
        <text
          x="24"
          y="1288"
          fill="#5b6873"
          font-size="11"

        <text

          font-family="'IBM Plex Sans', sans-serif"

          GameResult. A level result with no time stays local (DS-5).
        </text>

          progress:&lt;user id&gt;:&lt;game id&gt; for the owner, the last signed-in user, and under
          progress:&lt;game id&gt; for the anonymous owner.

        <text

          key. As AnonymousProgress it merges progress:&lt;game id&gt; into the owner, then forgets
