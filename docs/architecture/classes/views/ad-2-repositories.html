        <title id="adrepos-title">HexaBlock repositories · UML class diagram</title>
        <desc id="adrepos-desc">
          Class diagram across layers 4, 3 and 2 showing ApiProgressGateway in layer 3, which holds
          the ProgressApi transport interface and the ApiDtoMapper of layer 3 and implements the
          ProgressGateway port of layer 2 (decisions 22 and 66, #46). ApiClient in layer 4, the
          driver, implements ProgressApi. LocalProgressRepository in layer 3 holds the KeyValueStore
          driver interface of layer 3 and the SessionStore port, and implements two ports:
          ProgressRepository with load() and save(), and AnonymousProgress with loadAnonymous() and
          forgetAnonymous(). It keeps the GameProgress of each game as plain JSON in the store,
          under a key with the user id of the session, or under the anonymous key with no session.
          LocalAchievementCounterRepository in layer 3 holds the same KeyValueStore and implements
          the AchievementCounterRepository port of layer 2: it keeps the AchievementCounters of each
          game as plain JSON with a version under its own key (#363). DeviceKeyValueStore implements
          KeyValueStore over AsyncStorage.
        </desc>
