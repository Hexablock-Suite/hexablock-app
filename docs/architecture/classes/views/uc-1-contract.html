        <title id="uccontract-title">HexaBlock use case contract · UML class diagram</title>
        <desc id="uccontract-desc">
          Class diagram of layer 2 showing the UseCase input port that every use case implements,
          whose execute() returns a Result, and SyncProgress (#46), a use case of the code, which
          implements UseCase bound to SyncProgressRequest and void. The abstract UseCaseAspect
          decorator implements UseCase, wraps one inner UseCase and turns every exception into a
          failed Result. The logging and session aspects and the planned retry aspect extend it, and
          the composition root wraps each use case through decorate(), with LoggingAspect outside.
          SessionAspect (#481) requires a session before the two leaderboard use cases of #47 and
          clears the session when the backend refuses the token, also for SyncProgress. It holds a
          SessionStore and a SessionNeed, required or optional. The logging aspect uses the Logger
          output port and reads the engine Clock before and after the call (#343). Logger takes a
          UseCaseLogEntry with the use case name, the outcome, the duration of the call, the error
          and the failed deliveries of a success, and the adapter writes the text.
        </desc>
