        <title id="flowstart-title">HexaBlock StartGame flow · UML class diagram</title>
        <desc id="flowstart-desc">
          Cross-layer class diagram of the StartGame use case only. In layer 4, GameScreen uses
          GamePresenter. In layer 3, GamePresenter uses the UseCase input port, and
          InMemoryRunningGameStore implements the RunningGameStore port and keeps the running
          GameEngine. In layer 2, StartGame implements UseCase, takes a StartGameRequest, keeps the
          RunningGameStore port and the GameFactory, and builds a MoveResult. In layer 1,
          GameFactory keeps the IVariantFactory and creates the started GameEngine. LinesFactory
          implements IVariantFactory and builds the board with BoardBuilder; both hold the
          GeometryFactory, and BoardBuilder creates Board. StartGame reads the cells of Board. Every
          dependency between layers points down.
        </desc>
