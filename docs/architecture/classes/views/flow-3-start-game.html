        <title id="flowstart-title">HexaBlock StartGame flow · UML class diagram</title>
        <desc id="flowstart-desc">
          Cross-layer class diagram of the StartGame use case only. In layer 4, GameScreen uses
          GamePresenter. In layer 3, GamePresenter uses the UseCase input port,
          InMemoryGameRepository implements the GameRepository port and keeps the running
          GameEngine, and LevelGameFactories implements the GameFactories port. In layer 2,
          StartGame implements UseCase, takes a StartGameRequest with an optional level id, keeps
          the GameRepository and GameFactories ports, also keeps the LevelRepository and
          ProgressRepository ports, the GameId and the figure to refuse a locked level, asks the
          GameFactory of the level for the started game, and builds a MoveResult. In layer 1,
          GameFactory keeps the GameId and the IVariantFactory, wraps the rules of a timed game in
          TimedRulesDecorator and creates the started GameEngine. LinesFactory implements
          IVariantFactory and builds the board with BoardBuilder; both keep the GeometryFactory as
          geometry, and BoardBuilder creates Board. StartGame reads the occupied cells and the free
          spaces of Board. Every dependency between layers points down.
        </desc>
