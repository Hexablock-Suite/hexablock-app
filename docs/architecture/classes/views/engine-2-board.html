          class, keeping one BoardSpace entity for each written coordinate, using its BoardShape and
          taking its geometry from the GridTopology strategy, the ShapeNode composite of CellNode
          leaves and ShapeGroup children, and Piece using a ShapeNode as a prototype that clones
          itself. Board is an entity: its BoardId is its identity, and equals() compares two boards
          by it.
