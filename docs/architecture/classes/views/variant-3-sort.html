        <title id="sort-title">HexaBlock Hexa Sort variant · UML class diagram</title>
        <desc id="sort-desc">
          Class diagram of the Hexa Sort variant in layer 1 showing SortFactory creating the
          SortRules and SortScoring strategies and holding a SortLevel that SortLevelBuilder builds
          step by step from a header, the board region, the goals and the piece source, with
          SortRules typed by SortState and SortState holding ColorStack cells, each variant class
          marked with the engine interface it implements and its binding. GoalCount is the value
          object of the goal of a level. SortState is an entity inside the GameEngine aggregate: its
          own GameStateId is its identity, it keeps the MatchId of its game, and it changes in place
          only through its business methods.
        </desc>
