      <h1>Hexa Sort: stacks, cascades and levels</h1>

        <title id="sort-title">HexaBlock Hexa Sort variant · UML class diagram</title>
        <desc id="sort-desc">
          Class diagram of the Hexa Sort variant in layer 1 showing SortFactory creating the
          SortRules and SortScoring strategies and holding a SortLevel that SortLevelBuilder builds
          from the topology and the section of a level file: the radius of the board region, the
          goals, the piece source and the star thresholds, each turned into its value object. The
          builder holds a GeometryFactory and refuses a topology of another family. SortLevel is a
          value object with private fields: the size of its board region, its goal and the data of
          its piece source, which is the seed with its colors, the colors alone or the fixed list of
          stacks, and the thresholds of its stars, which it counts for LevelProgress as an
          ILevelStars. It holds no piece source, and SortFactory builds a new source from that data
          for each game, with a new seed of its RandomSource in each match for the default level.
          The source gives ColorStack draws, so SortFactory binds TPiece to ColorStack. The diagram
          shows SortRules typed by SortState and SortState holding ColorStack cells, each variant
          class marked with the engine interface it implements and its binding. GoalCount is the
          value object of the goal of a level, and ClearedStacks is the value object of the count of
          cleared stacks that the goal reads. SortPlay holds the Moves of one won level in a private
          field, and SortStarThreshold tells whether a play meets its limit: it gives the limit to
          isWithin() of the play. SortState is an entity inside the GameEngine aggregate: its own
          GameStateId is its identity, it keeps the MatchId of its game, and it changes in place
          only through its business methods. TileCount is the value object of the height of a stack:
          ColorStack gives it, and SortState keeps the TileCount of each cleared stack.
        </desc>

          </text>
          <text
            x="24"
            y="728"
            fill="#5b6873"
            font-size="11"
            font-family="'IBM Plex Sans', sans-serif"
          >
            withSection() turns the radius r into the RegionSize r + 1 and each number into its
            value object. build() calls seeded() or fixed(), then withStars() (decision 15, D9).
          </text>
          <text
            x="24"
            y="744"
            fill="#5b6873"
            font-size="11"
            font-family="'IBM Plex Sans', sans-serif"
          >
            TCoord is the coordinate type of the geometry (decision 16), and each class that names
            it declares it. In a binding, SortState stands for SortState‹TCoord›.
          </text>
          <text
            x="24"
            y="760"
            fill="#5b6873"
            font-size="11"
            font-family="'IBM Plex Sans', sans-serif"
          >
            ClearedStacks counts the cleared stacks, and GoalCount.isReachedBy() reads it (decision
            42).
          </text>

            x="24"

            font-size="11"
            font-family="'IBM Plex Sans', sans-serif"
          >
            starsFor() of ILevelStars counts with sortStars() the leading thresholds that the play
            meets, so a level with no threshold gives 0 stars (decision 36). Moves, Stars: Part 1,
            view 4.
          </text>
          <text
            x="24"
            y="792"
            fill="#5b6873"
            font-size="11"
            font-family="'IBM Plex Sans', sans-serif"
          >
            TileCount is the height of a stack (issue 232): ColorStack.tileCount() gives it,
            SortState keeps one for each stack that the last turn cleared, and SortScoring adds
            their points.
          </text>

            x="24"

            font-size="11"
            font-family="'IBM Plex Sans', sans-serif"
          >
            SortSnapshot keeps its fields private (#245): offeredStack(), goalsReached(), goal(),
            clearedStackHeights(), lastPlacedAt(); SortView uses deliverTo().
