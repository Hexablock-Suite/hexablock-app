        <desc id="ucaccount-desc">
          Class diagram of layer 2 showing the use cases Register, Login and UpdateSettings, each
          implementing the UseCase input port with its binding. Register and Login use the
          AccountGateway and SessionStore output ports, UpdateSettings uses the SettingsStore output
          port, and AccountGateway returns Session values and rejects with an AccountFailure that
          carries a failure code. Register and Login also keep an optional AnonymousMerge, so a
          sign-in merges the progress played with no account into its user (#46). SessionStore also
          gives owner(), the user id of the last signed-in player, and clears the token:
          SyncProgress of view 3.3 calls clear() when the backend refuses the token, and the owner
          stays (#46, decision 66).
        </desc>
