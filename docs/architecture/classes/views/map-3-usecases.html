        <desc id="mapuc-desc">
          Overview map of the 50 layer 2 classes in 8 groups, AchievementCounterRepository of #363
          among the output ports, SyncProgress of #46 among the progress use cases with its ports
          AnonymousProgress and ProgressGateway, its request SyncProgressRequest and its error
          SyncFailure, the achievements of #188 among them, with LevelDefinition, LevelStatus,
          AchievementGoal, LevelsWon, EveryLevelWon, BestCountReached and TotalCountReached of layer
          1 as dashed chips (#326, #364). Each line joins two classes: UseCaseAspect implements
          UseCase and decorates the one it wraps, StartGame, SaveProgress, LoadProgress and Register
          each implement UseCase for their group, and RedoMove, SyncLeaderboard and UpdateSettings
          keep an output port. No line touches a group frame. Each group names the view that shows
          its members.
