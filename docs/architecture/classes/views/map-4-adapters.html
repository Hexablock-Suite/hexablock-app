        <title id="mapad-title">HexaBlock adapters map · UML class diagram</title>
        <desc id="mapad-desc">
          Overview map of the 67 classes of layers 4 and 3 in 13 groups. The composition root group
          holds CompositionRoot, GameRegistry and BoardFigure, the drivers group holds
          SequentialMatchIds, the move controls group holds MoveControls, FitControls, MergeControls
          and BoardOnlyControls, and the events group holds GameEventBus, GameEventListener,
          AchievementCounterListener and NullGameEventPublisher. Each line joins two classes:
          GameScreen renders BoardView and keeps its GamePresenter and its MoveControls,
          CompositionRoot creates InMemoryGameRepository, DeviceKeyValueStore implements
          KeyValueStore, GamePresenter keeps its StateMapper and LocalProgressRepository keeps its
          KeyValueStore. No line touches a group frame. Each group names the view that shows its
          members.
        </desc>
