      <svg

        <title id="adwiring-title">HexaBlock wiring · UML class diagram</title>
        <desc id="adwiring-desc">
          Class diagram across layers 4 and 3 showing CompositionRoot in layer 4, in
          src/infrastructure/composition-root.ts, creating each driver once: SeededRandomSource,
          ConsoleLogger and SequentialMatchIds, which implement the RandomSource, Logger and
          MatchIdGenerator interfaces, and the planned AudioManager and SessionManager. It reads
          each BoardFigure, the hexagon, the square and the triangle, keeps one GameRegistry for
          each figure, which maps each GameId to its registered game, keeps the LevelRepository of
          the bundled levels, and creates GameEventBus, InMemoryGameRepository and
          LevelGameFactories, which implements the GameFactories port, in layer 3, so single-scope
          injection replaces a classic Singleton. With a store in its drivers it also creates one
          LocalAchievementCounterRepository, which implements the AchievementCounterRepository port,
          and gives it to the counter listener of the bus (#363). With a store in its drivers it
          creates LocalProgressRepository once, keeps it as progress for every consumer of the saved
          progress, and builds ListAchievements over it once, and listAchievements() gives it.
        </desc>
