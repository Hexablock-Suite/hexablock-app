        <title id="adwiring-title">HexaBlock wiring · UML class diagram</title>
        <desc id="adwiring-desc">
          Class diagram across layers 4, 3 and 2 showing CompositionRoot in layer 4, in
          src/infrastructure/composition-root.ts, creating each driver once: SeededRandomSource,
          ConsoleLogger and SequentialMatchIds, which implement the RandomSource, Logger and
          MatchIdGenerator interfaces, and the planned AudioManager. It receives ApiClient, the
          transport that implements AccountApi, ProgressApi, LeaderboardApi and LevelsApi. It reads
          each BoardFigure, the hexagon, the square and the triangle, keeps one GameRegistry for
          each figure, which maps each GameId to its registered game, keeps the one LevelRepository,
          which is a CombinedLevelRepository over BundledLevelRepository and ApiLevelRepository with
          the transport and BundledLevelRepository alone without it, and starts the first refresh()
          of the backend levels (#48, decision 68), and creates GameEventBus, InMemoryGameRepository
          and LevelGameFactories, which implements the GameFactories port, in layer 3, so
          single-scope injection replaces a classic Singleton. With a store in its drivers it also
          creates one LocalAchievementCounterRepository, which implements the
          AchievementCounterRepository port, and gives it to the counter listener of the bus (#363).
          With a store in its drivers it creates LocalProgressRepository once, which implements
          ProgressRepository and AnonymousProgress, keeps it as progress for every consumer of the
          saved progress, and builds ListAchievements, LoadProgress and ListLevels over it once
          (#181, #188, #173, #410). It creates the one SessionManager and the one ApiDtoMapper
          (#45), and gives Register and Login the LocalProgressRepository in its anonymous role with
          the id of each game, so a sign-in merges the anonymous progress (#46). For the sync (#46)
          it creates ApiProgressGateway over the transport and that mapper, and builds SyncProgress
          once through decorate() over SessionManager, LocalProgressRepository and the gateway. It
          gives SyncProgress to each ResultPresenter of gameSession() and to the AccountPresenter of
          accountPresenter(). CompositionRoot implements ScreenServices, the closed interface of the
          screens, and builds the presenter of each screen (#411). For the leaderboards (#47) it
          creates ApiLeaderboardGateway over the transport and the same mapper, builds
          GetGlobalLeaderboard and GetLevelLeaderboard once through decorate() over SessionManager
          and that gateway, and gives both to each LeaderboardPresenter of leaderboardPresenter().
        </desc>

        </text>

        </text>

        <text

        <text

          ListAchievements (view 3.6) once over the same LevelRepository and LocalProgressRepository

          since #326 and #364 (view 3.6).
        </text>

          AchievementCounterListener, which saves the counters (#363), and to ListAchievements
          (#364).
        </text>
        <text

          every game (#181, #410). A root with no store offers none of them, and asking throws a
          RangeError.
        </text>
        <text
          x="24"
          y="1730"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >

          listLevels() gives it to the level selector (#173).
        </text>
        <text

          y="1746"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >

          the screen keeps it. A hook sees only ScreenServices (decision 18, #411).
        </text>

          y="1762"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"

          the root builds SessionManager, Register and Login once (#45, decision 65).
        </text>

          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"

          key of the saved progress carries the owner, the last signed-in user, and a refused token
          keeps it.
        </text>
