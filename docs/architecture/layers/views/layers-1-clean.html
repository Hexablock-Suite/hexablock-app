        <title id="layers-title">HexaBlock client · Clean layer diagram</title>
        <desc id="layers-desc">
          Layer diagram of the client as four concentric rings: layer 4, frameworks and drivers,
          outside; layer 3, interface adapters; layer 2, use cases; and layer 1, entities, in the
          center. The ports of layer 2 sit on its edge: the input port UseCase, which the presenters
          call and every use case and aspect implements, and the output ports GameRepository,
          GameFactories, LevelRepository, GameEventPublisher, ProgressRepository and Logger, which
          the use cases use. In layer 3, InMemoryGameRepository, LevelGameFactories,
          CombinedLevelRepository, BundledLevelRepository, GameEventBus and LocalProgressRepository
          implement the output ports, LocalProgressRepository keeps its data through the
          KeyValueStore interface, and the board components of layer 4 use the board layouts of
          layer 3. The HTTP adapters of layer 3 hold the transport interfaces HealthApi, AccountApi,
          ProgressApi, LeaderboardApi and LevelsApi, ApiAccountGateway, ApiProgressGateway,
          ApiLeaderboardGateway, ApiLevelRepository, ApiDtoMapper and the DTO types, and ApiClient
          of layer 4 implements the transport interfaces (decision 22). Since #46 ApiProgressGateway
          implements the ProgressGateway port, and LocalProgressRepository also implements the
          AnonymousProgress port and reads SessionStore for its key. Since #48 ApiLevelRepository
          implements the LevelRepository port, and CombinedLevelRepository joins it with
          BundledLevelRepository (decision 68). In layer 4, ConsoleLogger implements Logger,
          DeviceKeyValueStore implements KeyValueStore, DeviceSecretStore implements SecretStore,
          and SystemClock, SeededRandomSource and SequentialMatchIds implement the engine interfaces
          Clock, RandomSource and MatchIdGenerator. The routes use the presenters, and
          CompositionRoot creates the adapters. The use cases and the presenters use the generic
          engine, and the four variants implement its contracts. Every arrow points inward, toward
          layer 1, or stays inside one layer. A dashed border marks a planned part.
        </desc>
