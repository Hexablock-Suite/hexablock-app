        <title id="seqsave-title">
          HexaBlock SaveProgress and SyncProgress flow · UML sequence diagram
        </title>
        <desc id="seqsave-desc">
          Sequence diagram of one saved result and of the sync after it (#46, D27). ResultPresenter
          in layer 3 builds the GameResult and calls execute() on SaveProgress in layer 2, which
          loads the GameProgress through LocalProgressRepository, records the result with
          IProgressModel and saves it. LocalProgressRepository reads the session from SessionManager
          for the key of the user. ResultPresenter shows VictoryScreen, then calls execute() on
          SyncProgress. SyncProgress reads the session. With no session it returns and sends
          nothing. Otherwise it loads the progress of the account and the anonymous progress; when
          an anonymous progress exists it merges it with mergeWith(), saves the progress and forgets
          the anonymous progress. It calls sync() on ApiProgressGateway, which maps the progress
          with ApiDtoMapper and calls syncProgress() on ApiClient, which sends POST /v1/progress to
          ProgressController of hexablock-api. The answer goes back as a GameProgress, SyncProgress
          merges it and saves it, and returns a Result with no value.
        </desc>

          SessionStore and returns Result.failure(error), and the result asks the player to sign in.
          No answer gives
        </text>

          saved result. The sign-in of flow 5 also runs SyncProgress for each registered game
          (decision 66).
        </text>
