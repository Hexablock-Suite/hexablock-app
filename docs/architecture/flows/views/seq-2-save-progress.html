      <h1>
        SaveProgress and SyncProgress step by step: one result saved on the device, then sent to the
        backend
      </h1>
      <svg

        <title id="seqsave-title">
          HexaBlock SaveProgress and SyncProgress flow · UML sequence diagram
        </title>
        <desc id="seqsave-desc">
          Sequence diagram of one saved result and of the sync after it (#46, D27, decision 66).
          ResultPresenter in layer 3 builds the GameResult and calls execute() on SaveProgress in
          layer 2. SaveProgress asks LocalProgressRepository for the owner, which it reads from
          SessionManager, then calls update() with the owner, the game id and a change. In the queue
          of the key, the repository loads the progress, calls the change, which records the result
          with IProgressModel, and saves it. ResultPresenter shows VictoryScreen, then calls
          execute() on SyncProgress. SyncProgress reads the session. With no session it returns and
          sends nothing. Otherwise the user of the session is the owner: SyncProgress calls
          mergeAnonymousInto() on the repository, which merges any anonymous progress with
          mergeWith(), saves it and forgets the anonymous key, and then loads the progress of the
          owner. It calls sync() on ApiProgressGateway, which maps the progress with ApiDtoMapper
          and calls syncProgress() on ApiClient, which sends POST /v1/progress to ProgressController
          of hexablock-api. The answer goes back as a GameProgress. SyncProgress calls update(), and
          its change merges the answer into the stored progress with mergeWith(); the repository
          saves it, and SyncProgress returns a Result with no value.
        </desc>

        </text>

          pointing down. Each use case reads the owner once and gives it to every call, so one
          operation uses one key (decision 66).
        </text>
        <text
          x="24"
          y="1576"

          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          update() runs load, change and save in one queue per key, so a save during the request of
          a sync loses nothing. After a save, ResultPresenter shows the result, then calls
          SyncProgress: no screen waits for the network.
        </text>
        <text

          font-size="11"

          With no session, SyncProgress sends nothing. The opt fragment runs only when anonymous
          progress is left: the sign-in of flow 5 merges it first, so this step repeats a merge that
          failed. The thick teal call
        </text>

          A 401 throws SyncFailure(session-expired); SyncProgress fails, and SessionAspect calls
          clear(), which keeps the owner.
        </text>
        <text
          x="24"
          y="1624"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          No answer gives backend-unreachable, any other failure sync-failed, and the local progress
          keeps every saved result. The sign-in of flow 5 also runs SyncProgress for each registered
          game (decision 66).
        </text>
