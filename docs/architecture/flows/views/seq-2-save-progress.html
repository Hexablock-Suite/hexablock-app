      <h1>SaveProgress step by step: one result from the screen to the backend and back</h1>
      <svg

      >
        <title id="seqsave-title">HexaBlock SaveProgress flow · UML sequence diagram</title>
        <desc id="seqsave-desc">
          Sequence diagram of one saved result. VictoryScreen in layer 4 gives the GameResult to
          ResultPresenter in layer 3, which calls execute() on SaveProgress in layer 2 through the
          UseCase port. SaveProgress asks IProgressModel in layer 1 for the ProgressRecord and saves
          it through the ProgressRepository port, which ApiProgressRepository in layer 4 implements.
          ApiDtoMapper makes a ProgressDto, and ApiClient sends it over HTTP to
          ProgressController.sync() of hexablock-api. The response travels back as a Result to the
          screen.
        </desc>
