      <h1>StartGame step by step: one new game from the screen to the engine and back</h1>
      <svg
        viewBox="0 0 2172 2408"

        aria-labelledby="seqstart-title seqstart-desc"

        <title id="seqstart-title">HexaBlock StartGame flow · UML sequence diagram</title>
        <desc id="seqstart-desc">
          Sequence diagram of one new game. The player opens a game on GameScreen in layer 4.
          GamePresenter in layer 3 calls execute() on StartGame in layer 2 through the UseCase port,
          with the level id of the request. StartGame asks its GameFactories port, which
          LevelGameFactories of layer 3 implements, for the GameFactory of the level. In an alt
          fragment, a request with a level id makes LevelGameFactories ask BundledLevelRepository
          for the LevelDefinition of the level, create the level builder of the variant and give it
          to LevelDefinition.buildWith(), which calls withTopology(), withSection() and build() on
          the builder. LevelGameFactories then creates the variant factory of the built level and a
          GameFactory over it. A request with no level id gets the registered GameFactory. StartGame
          calls createGame() on that GameFactory in layer 1. GameFactory asks the MatchIdGenerator
          for one new MatchId, builds the GameStateId and the BoardId from it, and asks the
          IVariantFactory for the timer with the MatchId, the rules, the scoring and the history. It
          wraps the rules of a timed game in TimedRulesDecorator, creates GameEngine with the
          MatchId and the timer, and asks the IVariantFactory for the first state with the three
          ids. The variant factory builds the board with BoardBuilder, with a region for Lines, Sort
          and Merge or with the figure of the level for Fit, and BoardBuilder asks its
          GeometryFactory for the topology. GameFactory starts GameEngine and returns it. StartGame
          keeps it in InMemoryGameRepository through the GameRepository port, reads the photo of the
          state, the occupied cells and the free spaces of its board, and returns a Result with a
          MoveResult. GamePresenter maps the cells as in flow 1 and GameScreen renders the board.
        </desc>
