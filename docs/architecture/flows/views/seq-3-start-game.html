      <h1>StartGame step by step: one new game from the screen to the engine and back</h1>
      <svg

        <title id="seqstart-title">HexaBlock StartGame flow · UML sequence diagram</title>
        <desc id="seqstart-desc">
          Sequence diagram of one new game. The player opens a game on GameScreen in layer 4.
          GamePresenter in layer 3 calls execute() on StartGame in layer 2 through the UseCase port.
          StartGame asks the IVariantFactory of layer 1 for the rules, the scoring, the history and
          the first state. For an endless game the factory builds the board with BoardBuilder, which
          asks its GeometryFactory for the topology; for a level game a level builder does it.
          StartGame creates GameEngine, starts it, keeps it in InMemoryRunningGameStore through the
          RunningGameStore port, reads the cells of Board and returns a Result with a MoveResult.
          GamePresenter maps the cells as in flow 1 and GameScreen renders the board.
        </desc>
