      <svg

        <title id="seqstart-title">HexaBlock StartGame flow · UML sequence diagram</title>
        <desc id="seqstart-desc">
          Sequence diagram of one new game. The player opens a game on GameScreen in layer 4.
          GamePresenter in layer 3 calls execute() on StartGame in layer 2 through the UseCase port.
          StartGame calls createGame() on GameFactory in layer 1. GameFactory asks the
          MatchIdGenerator, the GameStateIdGenerator and the BoardIdGenerator for one new id each,
          and the IVariantFactory for the rules, the scoring and the history. It creates GameEngine
          with the MatchId, and asks the IVariantFactory for the first state with the three ids. The
          variant factory builds the board with BoardBuilder, with a region for Lines, Sort and
          Merge or with the figure of the level for Fit, and BoardBuilder asks its GeometryFactory
          for the topology. GameFactory starts GameEngine and returns it. StartGame keeps it in
          InMemoryRunningGameStore through the RunningGameStore port, reads the photo of the state
          and the cells of its board, and returns a Result with a MoveResult. GamePresenter maps the
          cells as in flow 1 and GameScreen renders the board.
        </desc>
