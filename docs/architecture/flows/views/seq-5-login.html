      <svg

        <title id="seqlogin-title">HexaBlock Login flow · UML sequence diagram</title>
        <desc id="seqlogin-desc">
          Sequence diagram of one sign-in. The player sends the credentials on AccountScreen in
          layer 4. AccountPresenter in layer 3 calls execute() on Login in layer 2 through the
          UseCase port. Login calls login() on ApiAccountGateway in layer 4 through the
          AccountGateway port. ApiDtoMapper makes a CredentialsDto, and ApiClient sends it over HTTP
          to AuthController.signIn() of hexablock-api. On success ApiDtoMapper turns the TokenDto
          into a Session, and Login writes it to SessionManager through the SessionStore port and
          returns a successful Result. On a rejected sign-in Login returns a failed Result.
        </desc>
