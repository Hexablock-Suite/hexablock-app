        <title id="seqlogin-title">HexaBlock Login flow · UML sequence diagram</title>
        <desc id="seqlogin-desc">
          Sequence diagram of one sign-in. The player sends the credentials on AccountScreen in
          layer 4. AccountPresenter in layer 3 calls execute() on Login in layer 2 through the
          UseCase port. Login calls login() on ApiAccountGateway in layer 3 through the
          AccountGateway port. ApiDtoMapper makes a CredentialsDto, and ApiClient sends it over HTTP
          to AuthController.signIn() of hexablock-api. On success ApiAccountGateway asks ApiClient
          for currentUser() with the token, and ApiClient sends GET /v1/auth/me with the bearer
          token. ApiDtoMapper turns the TokenDto and the CurrentUserDto into a Session, and Login
          writes it to SessionManager in layer 3 through the SessionStore port, so its user becomes
          the owner of the progress. Then it merges the progress played with no account into that
          user through the AnonymousProgress port, for each registered game (#46), and returns a
          successful Result. On a rejected sign-in the backend answers 401, the gateway rejects with
          an AccountFailure, and Login returns a failed Result with the code wrong-credentials.
        </desc>
