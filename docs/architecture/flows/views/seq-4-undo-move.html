      <h1>UndoMove step by step: one undo from the screen to the history and back</h1>
      <svg

        <title id="sequndo-title">HexaBlock UndoMove flow · UML sequence diagram</title>
        <desc id="sequndo-desc">
          Sequence diagram of one undo. The player taps undo on GameScreen in layer 4. GamePresenter
          in layer 3 calls execute() on UndoMove in layer 2 through the UseCase port. UndoMove takes
          the running GameEngine from InMemoryRunningGameStore through the RunningGameStore port and
          asks it for its IUndoable capability. When the capability is undefined, UndoMove returns a
          failed Result. Otherwise MoveHistory, which implements IUndoable, undoes the last
          MoveCommand, which gives its before state back to GameEngine through restore(). UndoMove
          reads the snapshot, the cells of Board and the undo and redo flags, and returns a Result
          with a MoveResult. GamePresenter maps it as in flow 1 and GameScreen renders the board.
        </desc>
