        <title id="seqmove-title">HexaBlock ApplyMove flow · UML sequence diagram</title>
        <desc id="seqmove-desc">
          Sequence diagram of one move. The player taps a cell on GameScreen in layer 4.
          GamePresenter in layer 3 calls execute() on ApplyMove in layer 2 through the UseCase port.
          ApplyMove takes the running GameEngine from InMemoryGameRepository in layer 3 through the
          GameRepository port, plays the move on GameEngine in layer 1, which runs playTurn() on
          IGameRules, takes the events that GameEngine recorded and publishes each one to the
          GameEventPublisher port, reads the photo of the state, its occupied cells and its free
          spaces, asks the root canUndo(), canRedo(), offersUndo() and elapsedTime(), and returns a
          Result with a MoveResult. GamePresenter maps each space with StateMapper, builds
          GameViewModel and GameScreen renders it.
        </desc>
